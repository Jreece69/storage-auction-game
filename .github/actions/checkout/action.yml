name: Checkout with cached LFS
description: >-
  Pulls Git LFS files through the Actions cache, so CI doesn't spend the
  account's LFS bandwidth allowance on every run. Use after actions/checkout.
runs:
  using: composite
  steps:
    - name: List LFS files
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids.txt

    - name: Restore LFS cache
      uses: actions/cache@v6
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-ids.txt') }}

    - name: Pull LFS files
      shell: bash
      run: git lfs pull
